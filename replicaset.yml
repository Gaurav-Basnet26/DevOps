apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: myapp
  labels:  
     type: front-end
spec:
 replicas: 1
 selector:
   matchLabels: 
    type: front-end
 template:
    metadata:
     name: myapp 
     labels:
         type: front-end 
    spec: 
      containers:
      - name: mynginx
        image: nginx:1.28
        ports:
        - containerPort: 80 

